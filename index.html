<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紅花吃檳榔：單檔 HTML 完整內容版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="card sidebar">
      <h1 class="title">紅花吃檳榔｜單檔 HTML 完整內容版</h1>
      <div class="kv"><span>時間</span><b id="clock"></b></div>
      <div class="kv"><span>危險狀態</span><b id="dangerState"></b></div>
      <div class="kv"><span>燭火值</span><b id="candleText" aria-live="polite"></b></div>
      <div class="bar"><div id="candleBar" class="fill" role="progressbar" aria-label="燭火值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="background: linear-gradient(90deg, #d68484, #efaaae);"></div></div>
      <div class="kv"><span>信任度</span><b id="trustText"></b></div>
      <div class="bar"><div id="trustBar" class="fill"></div></div>
      <div class="kv"><span>物證進度</span><b id="evidenceText"></b></div>
      <div class="chips" id="evidenceChips"></div>
      <div class="kv"><span>人物線索</span><b id="clueText"></b></div>
      <div class="chips" id="clueChips"></div>
      <div class="row" style="margin-top:10px;">
        <button id="saveBtn">💾 儲存進度</button>
        <button id="loadBtn">📂 載入進度</button>
      </div>
      <button id="resetBtn" style="margin-top:8px;">♻ 重新開始</button>
      <button id="archiveBtn" style="margin-top:8px;">📚 全內容文字庫</button>
      <button id="audioBtn" style="margin-top:8px;">🔈 音樂：關</button>
      <div class="log" id="log"></div>
    </aside>

    <main class="card main">
      <div id="battleStatusWindow" class="dq-window" aria-live="polite" aria-atomic="true" aria-label="戰鬥狀態資訊"></div>
      <div class="scene-img-wrap">
        <img id="sceneImg" src="" alt="" />
        <img id="monsterImg" src="" alt="" aria-hidden="true" />
        <img id="effectLayer" alt="" aria-hidden="true" />
        <div id="sceneHotspots" class="scene-hotspots" aria-label="場景互動熱區"></div>
        <div id="honghuaMarker" aria-hidden="true"></div>
        <div id="playerMarker" aria-hidden="true"></div>
      </div>
      <div class="scene-name" id="sceneName"></div>
      <div class="scene" id="sceneText"></div>
      <div class="status" id="statusLine"></div>
      <div class="btns" id="options"></div>
    </main>
  </div>

    <script src="database.js"></script>
  <script src="scenes.js"></script>
  <script src="engine.js"></script>
</body>
</html>
